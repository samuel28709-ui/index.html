<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARA TI </title>
  <style>
    .gallery {
      --d: 10s;
      display: grid;
      place-items: center;
      width: 220px;
      margin-left: 220px;
    }

    .gallery > img {
      grid-area: 1/1;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border: 10px solid #f2f2f2;
      box-shadow: 0 0 4px #0007;
      z-index: 2;
      animation: slide var(--d) infinite, z-order var(--d) infinite steps(1);
    }

    .gallery img:last-child {
      animation-name: slide, z-order-last;
    }

    .gallery > img:nth-child(1) { animation-delay: calc(0*var(--d)); --r: 16deg; }
    .gallery > img:nth-child(2) { animation-delay: calc(-0.2*var(--d)); --r: -1deg; }
    .gallery > img:nth-child(3) { animation-delay: calc(-0.4*var(--d)); --r: -19deg; }
    .gallery > img:nth-child(4) { animation-delay: calc(-0.6*var(--d)); --r: 6deg; }
    .gallery > img:nth-child(5) { animation-delay: calc(-0.8*var(--d)); --r: -8deg; }

    @keyframes slide {
      10% { transform: translateX(120%) rotate(var(--r)); }
      0%, 100%, 20% { transform: translateX(0%) rotate(var(--r)); }
    }

    @keyframes z-order {
      10%, 20% { z-index: 1; }
      80% { z-index: 2; }
    }

    @keyframes z-order-last {
      10%, 20% { z-index: 1; }
      90% { z-index: 2; }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      background: #b47090d7;
      overflow: hidden;
    }

    #hedlinecontainer {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
      margin-bottom: 60px;
    }

    #shine {
      font-size: 60px;
      font-weight: bold;
      color: rgba(255, 0, 0, 0.3);
      background: -webkit-gradient(linear, left top, right top, from(#222), to(#222), color-stop(0.5, #fff)) 0 0 no-repeat;
      -webkit-background-size: 150px;
      -webkit-background-clip: text;
      -webkit-animation: shine 3s infinite;
      text-shadow: 0 0px 0px rgba(233, 85, 189, 0.419);
    }

    @-webkit-keyframes shine {
      0%, 10% { background-position: -1000px; }
      20% { background-position: top left; }
      90% { background-position: top right; }
      100% { background-position: 1000px; }
    }

    @media only screen and (max-width: 600px) {
      #shine { font-size: 22px; }
      .gallery {
        width: 150px;
        margin-left: 60px;
      }
    }
  </style>
</head>
<body>
  <div id="hedlinecontainer">
    <div id="shine">TE AMO MI AMOR💞</div>
  </div>

  <div class="gallery">
    <img src="https://mail.google.com/mail/u/0?ui=2&ik=a89c8cc8ae&attid=0.1&permmsgid=msg-a:r-7541878935482960375&th=199f46abbb1f1fa4&view=att&disp=safe&realattid=199f466c062bb0510413&zw" alt="a lovely kiss in the night">
    <img src="https://mail.google.com/mail/u/0?ui=2&ik=a89c8cc8ae&attid=0.1&permmsgid=msg-a:r-7541878935482960375&th=199f46abbb1f1fa4&view=att&disp=safe&realattid=199f466c062bb0510413&zw" alt="a woman inside a car">
    <img src="https://mail.google.com/mail/u/0?ui=2&ik=a89c8cc8ae&attid=0.3&permmsgid=msg-a:r-7541878935482960375&th=199f46abbb1f1fa4&view=att&disp=safe&realattid=199f466c062bc5744591&zw" alt="a baby">
    <img src="https://mail.google.com/mail/u/0?ui=2&ik=a89c8cc8ae&attid=0.4&permmsgid=msg-a:r-7541878935482960375&th=199f46abbb1f1fa4&view=att&disp=safe&realattid=199f466c062bb213f432&zw" alt="a girl in the forest">
    <img src="https://mail.google.com/mail/u/0?ui=2&ik=a89c8cc8ae&attid=0.5&permmsgid=msg-a:r-7541878935482960375&th=199f46abbb1f1fa4&view=att&disp=safe&realattid=199f466c062bb1327c24&zw" alt="a girl">
  </div>
</body>
</html>
